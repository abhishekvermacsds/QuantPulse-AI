# Render Blueprint Specification for QuantPulse AI
# Auto-configures both Backend API and React Frontend
version: "1"

services:
  # 1. Backend REST API (FastAPI)
  - type: web
    name: quantpulse-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: bash build.sh
    startCommand: uvicorn quantpulse.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: PORTFOLIO_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///data/quantpulse.db
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: CACHE_DEFAULT_TTL
        value: "300"
      - key: CORS_ORIGINS
        value: https://quantpulse-dashboard.onrender.com

  # 2. Frontend Analytics Dashboard (React + Vite + TypeScript)
  - type: static
    name: quantpulse-dashboard
    plan: free
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: quantpulse-api
          property: url
